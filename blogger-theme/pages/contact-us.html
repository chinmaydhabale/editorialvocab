<div style="font-family: 'Plus Jakarta Sans', sans-serif; color: #f8fafc; line-height: 1.8; max-width: 900px; margin: 0 auto;">
  
  <div style="background: #131b2e; padding: 30px; border-radius: 16px; border: 1px solid #1e293b; margin-bottom: 24px;">
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 10px;">Contact Us</h1>
    <p style="font-size: 15px; color: #cbd5e1;">We would love to hear from you! Reach out for feedback, vocabulary suggestions, or exam preparation inquiries.</p>
  </div>

  <div style="background: #131b2e; padding: 24px; border-radius: 14px; border: 1px solid #1e293b; margin-bottom: 20px;">
    <h2 style="font-size: 18px; font-weight: 700; color: #34d399; margin-bottom: 14px;">📧 Email & Social Support</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
      <div style="background: #0f172a; padding: 16px; border-radius: 10px; border: 1px solid #1e293b;">
        <span style="font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Email Inquiry</span>
        <p style="font-size: 15px; font-weight: 700; color: #a5f3fc; margin-top: 4px;">chinmaydhabale007@gmail.com</p>
      </div>

      <div style="background: #0f172a; padding: 16px; border-radius: 10px; border: 1px solid #1e293b;">
        <span style="font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Telegram Channel</span>
        <p style="font-size: 15px; font-weight: 700; color: #818cf8; margin-top: 4px;">@EditorialVocabDaily</p>
      </div>
    </div>
  </div>

  <div style="background: #131b2e; padding: 24px; border-radius: 14px; border: 1px solid #1e293b;">
    <h2 style="font-size: 18px; font-weight: 700; color: #a5f3fc; margin-bottom: 14px;">💬 Send Us a Direct Message</h2>
    <form style="display: flex; flex-direction: column; gap: 14px;" onsubmit="alert('Thank you for reaching out! We will respond shortly.'); return false;">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px;">Your Name</label>
        <input type="text" required placeholder="e.g. Rahul Sharma" style="width: 100%; background: #0f172a; border: 1px solid #1e293b; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px;" />
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px;">Your Email Address</label>
        <input type="email" required placeholder="rahul@example.com" style="width: 100%; background: #0f172a; border: 1px solid #1e293b; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px;" />
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px;">Message / Suggestion</label>
        <textarea rows="5" required placeholder="Type your message here..." style="width: 100%; background: #0f172a; border: 1px solid #1e293b; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; resize: vertical;"></textarea>
      </div>

      <button type="submit" style="background: #6366f1; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px;">
        Send Message 🚀
      </button>
    </form>
  </div>

</div>
